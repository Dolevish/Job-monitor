# Job monitor - target companies | mapped 2026-10-06
#
# status:
#   verified  - board taken from the open ATS inventory (kalil0321/ats-scrapers) or a known live URL
#   signature - job URLs carry Comeet position ids (e.g. 98.A50); uid+token are read from the careers page at runtime
#   detect    - ATS unknown yet; detector reads the careers page on first run and fills ats/board
#   custom    - own site, needs a dedicated adapter (phase 2); also caught via boards meanwhile
#   boards    - staffing/integrators: no own feed; caught from Drushim/AllJobs/freehire by company name
#
# endpoints (public, no API key):
#   workday         POST https://{tenant}.{wd}.myworkdayjobs.com/wday/cxs/{tenant}/{site}/jobs
#   greenhouse      GET  https://boards-api.greenhouse.io/v1/boards/{board}/jobs?content=true
#   lever           GET  https://api.(eu.)lever.co/v0/postings/{slug}?mode=json   (board "eu:<slug>" = EU)
#   smartrecruiters GET  https://api.smartrecruiters.com/v1/companies/{board}/postings
#   oracle_hcm      GET  https://{host}.fa.us2.oraclecloud.com/hcmRestApi/resources/latest/recruitingCEJobRequisitions
#   eightfold       GET  https://{host}/api/pcsx/search?domain={domain}&location=Israel
#   comeet          GET  https://www.comeet.co/careers-api/2.0/company/{uid}/positions?token={token}&details=true
#   amazon          GET  https://www.amazon.jobs/en/search.json?normalized_country_code[]={board}
#   apple/google: company-site adapters (phase 2)

companies:
