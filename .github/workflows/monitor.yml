name: job-monitor

on:
  schedule:
    - cron: "7,37 * * * *"     # every 30 min (off the top of the hour, when GitHub is busiest)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print messages instead of sending to Telegram"
        type: boolean
        default: false
      reset_state:
        description: "Start from scratch (new baseline + re-detect all companies)"
        type: boolean
        default: false

concurrency:
  group: job-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The SQLite DB (seen jobs, detections, source health) lives in the Actions cache.
      - name: Restore state
        if: ${{ !inputs.reset_state }}
        uses: actions/cache/restore@v4
        with:
          path: state
          key: jobdb-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: jobdb-

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m monitor --db state/jobs.db -v ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: jobdb-${{ github.run_id }}-${{ github.run_attempt }}
